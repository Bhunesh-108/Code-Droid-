name: Build Android APK (Gradle 9.6.0)

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.6.0'

      - name: Sync Android with Capacitor
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle 9.6.0
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/CodeDroid-Mobile-IDE-v1.0-debug.apk

      - name: Upload APK Artifact for Direct Phone Download
        uses: actions/upload-artifact@v4
        with:
          name: CodeDroid-Mobile-IDE-v1.0-debug.apk
          path: release-output/CodeDroid-Mobile-IDE-v1.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/CodeDroid-Mobile-IDE-v1.0-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
